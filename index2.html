/* =====================================================
   TXT PARSE
===================================================== */

function parseLine(line) {

  line = line.trim();

  if (!line) {
    return null;
  }

  const equalIndex =
    line.indexOf("=");

  if (equalIndex === -1) {
    return null;
  }

  const word =
    line.substring(
      0,
      equalIndex
    ).trim();

  const rest =
    line.substring(
      equalIndex + 1
    ).trim();

  const parts =
    rest
      .split("/")
      .map(function(part) {
        return part.trim();
      })
      .filter(Boolean);

  if (parts.length === 0) {
    return null;
  }

  const meanings =
    parts[0]
      .split(",")
      .map(function(item) {
        return item.trim();
      })
      .filter(Boolean);

  const examples =
    parts.slice(1);

  if (
    !word ||
    meanings.length === 0
  ) {
    return null;
  }

  return {
    word: word,
    meanings: meanings,
    examples: examples
  };

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    const temp =
      array[i];

    array[i] =
      array[j];

    array[j] =
      temp;

  }

}


/* =====================================================
   PRONUNCIATION
===================================================== */

/*
  Tarayıcının kendi İngilizce seslendirme
  sistemini kullanıyoruz.

  Bu nedenle:

  - PC'de çalışır
  - Android'de çalışır
  - iPhone/iPad'de çalışır
  - ekstra API gerekmez
  - internet bağlantısı gerektirmeyebilir

  Kullanılabilir İngilizce sesi seçmeye çalışır.
*/

function pronounceWord(word) {

  if (
    !("speechSynthesis" in window)
  ) {

    alert(
      "Bu cihazda sesli okuma desteklenmiyor."
    );

    return;

  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      word
    );


  utterance.lang =
    "en-US";

  utterance.rate =
    0.85;

  utterance.pitch =
    1;


  const voices =
    window.speechSynthesis.getVoices();


  /*
    Öncelik:

    en-US
    en-GB
    diğer İngilizce sesler
  */

  let voice =
    voices.find(
      function(v) {
        return (
          v.lang &&
          v.lang.toLowerCase() ===
          "en-us"
        );
      }
    );


  if (!voice) {

    voice =
      voices.find(
        function(v) {
          return (
            v.lang &&
            v.lang.toLowerCase() ===
            "en-gb"
          );
        }
      );

  }


  if (!voice) {

    voice =
      voices.find(
        function(v) {
          return (
            v.lang &&
            v.lang.toLowerCase().startsWith(
              "en"
            )
          );
        }
      );

  }


  if (voice) {

    utterance.voice =
      voice;

  }


  window.speechSynthesis.speak(
    utterance
  );

}


/*
  Bazı tarayıcılarda ses listesi
  biraz geç yüklenebilir.
*/

if (
  "speechSynthesis" in window
) {

  window.speechSynthesis.onvoiceschanged =
    function() {

      window.speechSynthesis.getVoices();

}


/* FLASHCARD SES */

      selectedDeck.length === 0

      return;

    const item =

    pronounceWord(

  }
);


/* =====================================================
   STATS
===================================================== */

function loadStats() {

  try {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (saved) {

      const parsed =
        JSON.parse(saved);

      if (
        typeof parsed.good === "number" &&
        typeof parsed.bad === "number"
      ) {

        stats = parsed;

      }

    }

  } catch (error) {

    stats = {
      good: 0,
      bad: 0
    };

  }

}


function saveStats() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(stats)
  );

}


function renderStats() {

  const total =
    stats.good +
    stats.bad;

  let rate = 0;

  if (total > 0) {

    rate =
      Math.round(
        (stats.good / total) * 100
      );

  }

  statGood.textContent =
    stats.good;

  statBad.textContent =
    stats.bad;

  statRate.textContent =
    "%" + rate;

}


/* =====================================================
   SETTINGS
===================================================== */

function saveSettings() {

  const data = {

    chunkSize:
      parseInt(
        chunkSize.value,
        10
      ) || 50,

    start:
      selectedRange
        ? selectedRange.start
        : 0,

    end:
      selectedRange
        ? selectedRange.end
        : 0

  };

  localStorage.setItem(
    SETTINGS_KEY,
    JSON.stringify(data)
  );

}


function loadSettings() {

  try {

    const saved =
      localStorage.getItem(
        SETTINGS_KEY
      );

    if (!saved) {

      chunkSize.value = 50;

      return;

    }

    const data =
      JSON.parse(saved);

    chunkSize.value =
      data.chunkSize || 50;

    if (
      typeof data.start === "number" &&
      typeof data.end === "number" &&
      data.end > data.start
    ) {

      selectedRange = {

        start: data.start,

        end: data.end

      };

    }

  } catch (error) {

    chunkSize.value = 50;

  }

}


/* =====================================================
   RANGE BUTTONS
===================================================== */

function createRangeButtons() {

  ranges.innerHTML = "";

  const size =
    parseInt(
      chunkSize.value,
      10
    );

  if (
    !size ||
    size < 1 ||
    deck.length === 0
  ) {

    return;

  }


  const allButton =
    document.createElement("button");

  allButton.className =
    "range-btn";

  allButton.textContent =
    "Tümü (" +
    deck.length +
    ")";

  allButton.dataset.start =
    "0";

  allButton.dataset.end =
    String(deck.length);

  allButton.addEventListener(
    "click",
    function() {

      selectRange(
        0,
        deck.length,
        "Tümü"
      );

    }
  );

  ranges.appendChild(
    allButton
  );


  for (
    let start = 0;
    start < deck.length;
    start += size
  ) {

    const end =
      Math.min(
        start + size,
        deck.length
      );

    const button =
      document.createElement("button");

    button.className =
      "range-btn";

    button.textContent =
      (start + 1) +
      "-" +
      end;

    button.dataset.start =
      String(start);

    button.dataset.end =
      String(end);

    button.addEventListener(
      "click",
      function() {

        selectRange(
          start,
          end,
          (start + 1) +
          "-" +
          end
        );

      }
    );

    ranges.appendChild(
      button
    );

  }

}


/* =====================================================
   RANGE SELECT
===================================================== */

function selectRange(
  start,
  end,
  label
) {

  selectedDeck =
    deck.slice(
      start,
      end
    );

  if (
    selectedDeck.length === 0
  ) {

    return;

  }


  pool = [];

  for (
    let i = 0;
    i < selectedDeck.length;
    i++
  ) {

    pool.push(i);

  }

  shuffle(pool);


  selectedRange = {

    start: start,

    end: end,

    label: label

  };


  saveSettings();


  const buttons =
    ranges.querySelectorAll(
      ".range-btn"
    );

  buttons.forEach(
    function(button) {

      button.classList.remove(
        "active"
      );

      if (
        Number(button.dataset.start) === start &&
        Number(button.dataset.end) === end
      ) {

        button.classList.add(
          "active"
        );

      }

    }
  );


  selectedInfo.style.display =
    "block";

  selectedInfo.textContent =
    "Seçilen bölüm: " +
    label +
    " · " +
    selectedDeck.length +
    " kelime";


  nextCard();

}


/* =====================================================
   FLASHCARD
===================================================== */

function nextCard() {

  if (
    selectedDeck.length === 0
  ) {

    return;

  }


  if (
    pool.length === 0
  ) {

    for (
      let i = 0;
      i < selectedDeck.length;
      i++
    ) {

      pool.push(i);

    }

    shuffle(pool);

  }


  currentIdx =
    pool.pop();


  const item =
    selectedDeck[currentIdx];


  wordEl.textContent =
    item.word;

  meaningsEl.textContent =
    item.meanings.join(", ");


  examplesEl.innerHTML =
    "";


  item.examples.forEach(
    function(example) {

      const div =
        document.createElement("div");

      div.textContent =
        "• " + example;

      examplesEl.appendChild(
        div
      );

    }
  );


  meaningsEl.style.display =
    "none";

  examplesEl.style.display =
    "none";

  showBtn.style.display =
    "block";

  goodBtn.style.display =
    "none";

  badBtn.style.display =
    "none";


  progressEl.textContent =
    "Bu bölüm: " +
    selectedDeck.length +
    " kelime · Kalan: " +
    (pool.length + 1);

}

showBtn.addEventListener(

/* =====================================================
   GAME
===================================================== */

function getMeaning(item) {

  return item.meanings.join(", ");

}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =====================================================
   FIND WORD FORM
===================================================== */

function findWordForm(
  sentence,
  word
) {

  const cleanWord =
    word
      .trim()
      .replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );


  let regex =
    new RegExp(
      "\\b" +
      cleanWord +
      "\\b",
      "i"
    );

  let match =
    sentence.match(regex);

  if (match) {

    return match[0];

  }


  const root =
    word
      .trim()
      .toLowerCase();


  const patterns = [

    root + "ed",

    root + "d",

    root + "ing",

    root + "s",

    root + "es",

    root + "ies",

    root + "ied"

  ];


  for (
    let i = 0;
    i < patterns.length;
    i++
  ) {

    const candidate =
      patterns[i]
        .replace(
          /[.*+?^${}()|[\]\\]/g,
          "\\$&"
        );

    regex =
      new RegExp(
        "\\b" +
        candidate +
        "\\b",
        "i"
      );

    match =
      sentence.match(regex);

    if (match) {

      return match[0];

    }

  }


  return null;

}


/* =====================================================
   HIDE WORD
===================================================== */

function hideWordInSentence(
  sentence,
  word
) {

  const actualForm =
    findWordForm(
      sentence,
      word
    );


  if (actualForm) {

    const escaped =
      actualForm.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );

    const regex =
      new RegExp(
        "\\b" +
        escaped +
        "\\b",
        "i"
      );

    return {

      hidden:
        sentence.replace(
          regex,
          "_____"
        ),

      actualForm:
        actualForm

    };

  }


  const root =
    word
      .trim()
      .replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );


  const looseRegex =
    new RegExp(
      "\\b" +
      root +
      "[A-Za-z]*\\b",
      "i"
    );


  const looseMatch =
    sentence.match(
      looseRegex
    );


  if (looseMatch) {

    return {

      hidden:
        sentence.replace(
          looseRegex,
          "_____"
        ),

      actualForm:
        looseMatch[0]

    };

  }


  return null;

}


/* =====================================================
   CREATE OPTIONS
===================================================== */

function createOptions(
  correctItem
) {

  const options = [];

  options.push(
    correctItem
  );


  const candidates =
    selectedDeck.filter(
      function(item) {

        return (
          item.word.toLowerCase() !==
          correctItem.word.toLowerCase()
        );

      }
    );


  shuffle(candidates);


  for (
    let i = 0;
    i < candidates.length &&
    options.length < 4;
    i++
  ) {

    options.push(
      candidates[i]
    );

  }


  shuffle(options);

  return options;

}


/* =====================================================
   CREATE GAME QUESTIONS
===================================================== */

function createGameQuestions() {

  gameQuestions = [];


  selectedDeck.forEach(
    function(item) {

      if (
        !item.examples ||
        item.examples.length === 0
      ) {

        return;

      }


      item.examples.forEach(
        function(example) {

          const hiddenData =
            hideWordInSentence(
              example,
              item.word
            );


          if (!hiddenData) {

            return;

          }


          const options =
            createOptions(
              item
            );


          if (
            options.length < 4
          ) {

            return;

          }


          gameQuestions.push({

            item: item,

            sentence: example,

            hiddenSentence:
              hiddenData.hidden,

            actualForm:
              hiddenData.actualForm,

            options: options

          });

        }
      );

    }
  );


  shuffle(gameQuestions);

}

   GAME OPEN
===================================================== */

gameBtn.addEventListener(

    if (

    ) {

    }

    statsBox.style.display =

      "none";

      "block";


    gameStartScreen.style.display =
      "block";

    gameQuestionScreen.style.display =
      "none";


    gameStartBtn.textContent =
      "Oyunu Başlat";


    gameStartInfo.textContent =

      (

          ? selectedRange.label
          : ""
      ) +
      " · " +
      selectedDeck.length +
      " kelime. " +
      "Her örnek cümle ayrı soru olacak.";

  }
);


/* =====================================================
   GAME START
===================================================== */

gameStartBtn.addEventListener(
  "click",
  function() {

    createGameQuestions();


    if (
      gameQuestions.length === 0
    ) {

      alert(
        "Bu aralıkta yeterli örnek cümle bulunamadı. En az 4 farklı kelimenin bulunması gerekiyor."
      );

      return;

    }


    gameQuestionIndex = 0;

    gameScore = 0;

    gameAnswered = false;


    gameStartScreen.style.display =
      "none";

    gameQuestionScreen.style.display =
      "block";


    updateGameScore();

    showGameQuestion();

  }
);


/* =====================================================
   GAME SCORE
===================================================== */

function updateGameScore() {

  gameScoreEl.textContent =
    "Skor: " +
    gameScore +
    " / " +
    gameQuestionIndex;

}


/* =====================================================
   GAME QUESTION
===================================================== */

function showGameQuestion() {

  if (
    gameQuestionIndex >=
    gameQuestions.length
  ) {

    finishGame();

    return;

  }


  currentGameQuestion =
    gameQuestions[
      gameQuestionIndex
    ];


  gameAnswered = false;


  gameQuestionNumber.textContent =
    "Soru " +
    (gameQuestionIndex + 1) +
    " / " +
    gameQuestions.length;


  gameSentence.innerHTML =
    escapeHtml(
      currentGameQuestion.hiddenSentence
    ).replace(
      /_+/g,
      '<span class="blank">_____</span>'
    );


  gameOptions.innerHTML =
    "";


  currentGameQuestion.options.forEach(
    function(item) {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "option-btn";


      /*
        SES BUTONU
        SADECE KELİMENİN YANINDA
      */

      const soundButton =
        document.createElement(
          "button"
        );

      soundButton.type =
        "button";

      soundButton.className =
        "option-sound-btn";

      soundButton.textContent =
        "🔊";

      soundButton.title =
        "Kelimeyi dinle";

      soundButton.setAttribute(
        "aria-label",
        "Kelimeyi dinle"
      );


      soundButton.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();

          pronounceWord(
            item.word
          );

        }
      );


      /*
        Kelime + anlam alanı
      */

      const content =
        document.createElement(
          "div"
        );

      content.className =
        "option-content";


      const wordSpan =
        document.createElement(
          "span"
        );

      wordSpan.className =
        "option-word";

      wordSpan.textContent =
        item.word;


      content.appendChild(
        wordSpan
      );


      button.appendChild(
        soundButton
      );

      button.appendChild(
        content
      );


      button.addEventListener(
        "click",
        function(event) {

          /*
            Eğer ses butonuna
            basıldıysa cevaplama.
          */

          if (
            event.target.closest(
              ".option-sound-btn"
            )
          ) {

            return;

          }


          answerGame(
            button,
            item
          );

        }
      );


      gameOptions.appendChild(
        button
      );

    }
  );


  gameResult.innerHTML =
    "";

  gameNextBtn.style.display =
    "none";


  updateGameScore();

}


/* =====================================================
   GAME ANSWER
===================================================== */

function answerGame(
  selectedButton,
  selectedItem
) {

  if (gameAnswered) {

    return;

  }


  gameAnswered = true;


  const correctItem =
    currentGameQuestion.item;


  const actualForm =
    currentGameQuestion.actualForm;


  const buttons =
    gameOptions.querySelectorAll(
      ".option-btn"
    );


  buttons.forEach(
    function(button) {

      button.disabled =
        true;

    }
  );


  /*
    Cevaptan sonra anlamları göster.
  */

  buttons.forEach(
    function(button) {

      const word =
        button
          .querySelector(
            ".option-word"
          )
          .textContent;


      const item =
        currentGameQuestion.options.find(
          function(option) {

            return (
              option.word.toLowerCase() ===
              word.toLowerCase()
            );

          }
        );


      if (!item) {

        return;

      }


      const meaningSpan =
        document.createElement(
          "span"
        );

      meaningSpan.className =
        "option-meaning";

      meaningSpan.textContent =
        getMeaning(item);


      button
        .querySelector(
          ".option-content"
        )
        .appendChild(
          meaningSpan
        );

    }
  );


  /*
    Doğru cevabı yeşil.
  */

  buttons.forEach(
    function(button) {

      const word =
        button
          .querySelector(
            ".option-word"
          )
          .textContent;


      if (
        word.toLowerCase() ===
        correctItem.word.toLowerCase()
      ) {

        button.classList.add(
          "correct"
        );

      }

    }
  );


  const isCorrect =
    selectedItem.word.toLowerCase() ===
    correctItem.word.toLowerCase();


  if (isCorrect) {

    gameScore++;


    gameResult.innerHTML =
      "✅ Doğru! " +
      "<strong>" +
      escapeHtml(
        correctItem.word
      ) +
      "</strong>" +
      " (" +
      escapeHtml(
        getMeaning(correctItem)
      ) +
      ")";

  } else {

    selectedButton.classList.add(
      "wrong"
    );


    gameResult.innerHTML =
      "❌ Yanlış! Doğru cevap: " +
      "<strong>" +
      escapeHtml(
        correctItem.word
      ) +
      "</strong>" +
      " (" +
      escapeHtml(
        getMeaning(correctItem)
      ) +
      ")";

  }


  /*
    Gerçek cümleyi göster.
  */

  const revealed =
    document.createElement(
      "div"
    );

  revealed.className =
    "game-revealed-sentence";


  const sentenceEscaped =
    escapeHtml(
      currentGameQuestion.sentence
    );


  const actualRegex =
    new RegExp(
      escapeRegExp(actualForm),
      "i"
    );


  const highlightedSentence =
    sentenceEscaped.replace(
      actualRegex,
      function(match) {

        return (
          '<span class="game-revealed-word">' +
          escapeHtml(match) +
          "</span>"
        );

      }
    );


  revealed.innerHTML =
    "📌 Cümledeki kullanım:<br>" +
    highlightedSentence;


  gameResult.appendChild(
    revealed
  );


  updateGameScore();


  gameNextBtn.style.display =
    "block";

}


/* =====================================================
   REGEX ESCAPE
===================================================== */

function escapeRegExp(text) {

  return text.replace(
    /[.*+?^${}()|[\]\\]/g,
    "\\$&"
  );

}


/* =====================================================
   NEXT
===================================================== */

gameNextBtn.addEventListener(
  "click",
  function() {

    gameQuestionIndex++;

    showGameQuestion();

  }
);


/* =====================================================
   GAME FINISH
===================================================== */

function finishGame() {

  gameQuestionScreen.style.display =
    "none";

  gameStartScreen.style.display =
    "block";


  gameStartInfo.innerHTML =
    "🎉 Oyun bitti!<br><br>" +

    "<strong>" +
    gameScore +
    " / " +
    gameQuestions.length +
    "</strong>" +

    " doğru yaptın.";


  gameStartBtn.textContent =

}

   GAME CLOSE
===================================================== */

gameCloseBtn.addEventListener(

  function() {

    gamePanel.style.display =

    controls.style.display =
      "flex";

/* =====================================================
   INIT
===================================================== */

async function init() {

  loadStats();

  loadSettings();

  renderStats();


  try {

    const response =
      await fetch(
        DATA_FILE,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "august.txt bulunamadı."
      );

    }


    const text =
      await response.text();


    deck =
      text
        .split(/\r?\n/)
        .map(parseLine)
        .filter(Boolean);


    if (
      deck.length === 0
    ) {

      throw new Error(
        "august.txt içinde geçerli kelime bulunamadı."
      );

    }


    totalWords.textContent =
      deck.length;


    loading.style.display =
      "none";

    card.style.display =
      "flex";

    controls.style.display =
      "flex";

    statsBox.style.display =
      "flex";

    resetBtn.style.display =
      "block";


    createRangeButtons();


    if (
      selectedRange &&
      selectedRange.start >= 0 &&
      selectedRange.end <= deck.length
    ) {

      let label;


      if (
        selectedRange.start === 0 &&
        selectedRange.end === deck.length
      ) {

        label = "Tümü";

      } else {

        label =
          (selectedRange.start + 1) +
          "-" +
          selectedRange.end;

      }


      selectRange(
        selectedRange.start,
        selectedRange.end,
        label
      );

    } else {

      const size =
        parseInt(
          chunkSize.value,
          10
        ) || 50;


      const end =
        Math.min(
          size,
          deck.length
        );


      selectRange(
        0,
        end,
        "1-" + end
      );

    }

  } catch (error) {

    loading.style.display =
      "none";

    errorBox.style.display =
      "block";

    errorBox.textContent =
      "Hata: " +
      error.message +
      " august.txt dosyasının index.html ile aynı klasörde olduğundan emin ol.";

  }

}


init();
