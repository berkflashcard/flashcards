/* =========================
   TXT PARSE
========================= */

function parseLine(line) {

  line = line.trim();

  if (!line) {
    return null;
  }

  const equalIndex =
    line.indexOf("=");

  if (equalIndex === -1) {
    return null;
  }

  const word =
    line.substring(
      0,
      equalIndex
    ).trim();

  const rest =
    line.substring(
      equalIndex + 1
    ).trim();

  const parts =
    rest
      .split("/")
      .map(function(part) {
        return part.trim();
      })
      .filter(Boolean);

  if (parts.length === 0) {
    return null;
  }

  const meanings =
    parts[0]
      .split(",")
      .map(function(item) {
        return item.trim();
      })
      .filter(Boolean);

  const examples =
    parts.slice(1);

  if (
    !word ||
    meanings.length === 0
  ) {
    return null;
  }

  return {
    word: word,
    meanings: meanings,
    examples: examples
  };

}


/* =========================
   RANDOM
========================= */

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    const temp =
      array[i];

    array[i] =
      array[j];

    array[j] =
      temp;

  }

}

    };

}


function saveStats() {

}


function renderStats() {

  const total =
    stats.good +

  let rate = 0;

  if (total > 0) {

    rate =

}

========================= */

function saveSettings() {

  const data = {

      parseInt(

      ) || 50,

    start:
      selectedRange
        ? selectedRange.start
        : 0,

      selectedRange
        ? selectedRange.end
        : 0

  };

}


function loadSettings() {

  try {

    const saved =
      localStorage.getItem(
        SETTINGS_KEY
      );

    if (!saved) {

      chunkSize.value = 50;

      return;

    }

    const data =
      JSON.parse(saved);

    if (
      data.chunkSize &&
      data.chunkSize > 0
    ) {

      chunkSize.value =
        data.chunkSize;

    } else {

      chunkSize.value = 50;

    }

    if (
      typeof data.start ===
        "number" &&
      typeof data.end ===
        "number" &&
      data.end > data.start
    ) {

      selectedRange = {

        start: data.start,

        end: data.end

      };

    }

  } catch (error) {

    chunkSize.value = 50;

  }

}


/* =========================
   RANGE BUTONLARI
========================= */

function createRangeButtons() {

  ranges.innerHTML = "";

  const size =
    parseInt(
      chunkSize.value,
      10
    );

  if (
    !size ||
    size < 1 ||
    deck.length === 0
  ) {

    return;

  }


  /* TÜMÜ */

  const allButton =
    document.createElement(
      "button"
    );

  allButton.className =
    "range-btn";

  allButton.textContent =
    "Tümü (" +
    deck.length +
    ")";

  allButton.dataset.start =
    "0";

  allButton.dataset.end =
    String(deck.length);

  allButton.addEventListener(
    "click",
    function() {

      selectRange(
        0,
        deck.length,
        "Tümü"
      );

    }
  );

  ranges.appendChild(
    allButton
  );


  /* GRUPLAR */

  for (
    let start = 0;
    start < deck.length;
    start += size
  ) {

    const end =
      Math.min(
        start + size,
        deck.length
      );

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "range-btn";

    button.textContent =
      (start + 1) +
      "-" +
      end;

    button.dataset.start =
      String(start);

    button.dataset.end =
      String(end);

    button.addEventListener(
      "click",
      function() {

        selectRange(
          start,
          end,
          (start + 1) +
          "-" +
          end
        );

      }
    );

    ranges.appendChild(
      button
    );

  }

}


/* =========================
   ARALIK SEÇ
========================= */

function selectRange(
  start,
  end,
  label
) {

  selectedDeck =
    deck.slice(
      start,
      end
    );

  if (
    selectedDeck.length === 0
  ) {

    return;

  }


  pool = [];

  for (
    let i = 0;
    i < selectedDeck.length;
    i++
  ) {

    pool.push(i);

  }

  shuffle(pool);


  selectedRange = {

    start: start,

    end: end,

    label: label

  };


  saveSettings();


  /* AKTİF BUTON */

  const buttons =
    ranges.querySelectorAll(
      ".range-btn"
    );

  buttons.forEach(
    function(button) {

      button.classList.remove(
        "active"
      );

      const buttonStart =
        Number(
          button.dataset.start
        );

      const buttonEnd =
        Number(
          button.dataset.end
        );

      if (
        buttonStart === start &&
        buttonEnd === end
      ) {

        button.classList.add(
          "active"
        );

      }

    }
  );


  /* BİLGİ */

  selectedInfo.style.display =
    "block";

  selectedInfo.textContent =
    "Seçilen bölüm: " +
    label +
    " · " +
    selectedDeck.length +
    " kelime";


  nextCard();

}


/* =========================

========================= */

function nextCard() {

  if (
    selectedDeck.length === 0
  ) {

    return;

  }


  if (
    pool.length === 0
  ) {

    for (
      let i = 0;
      i < selectedDeck.length;
      i++
    ) {

      pool.push(i);

    }

    shuffle(pool);

  }


  currentIdx =
    pool.pop();


  const item =
    selectedDeck[currentIdx];


  wordEl.textContent =
    item.word;

  meaningsEl.textContent =
    item.meanings.join(", ");


  examplesEl.innerHTML =
    "";


  item.examples.forEach(
    function(example) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        "• " + example;

      examplesEl.appendChild(
        div
      );

    }
  );


  meaningsEl.style.display =
    "none";

  examplesEl.style.display =
    "none";


  showBtn.style.display =
    "block";

  goodBtn.style.display =
    "none";

  badBtn.style.display =
    "none";


  progressEl.textContent =
    "Bu bölüm: " +
    selectedDeck.length +
    " kelime · Kalan: " +
    (pool.length + 1);

}

===================================================== */


/*
  Bir kelimenin anlamını oluştur.
*/

function getMeaning(item) {

  return item.meanings.join(", ");

}


/*
  Cümlede hedef kelimeyi bulup
  ____ ile değiştiriyoruz.

  Büyük/küçük harf duyarlı değil.
*/

function hideWordInSentence(
  sentence,
  word
) {

  const escaped =
    word.replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );

  const regex =
    new RegExp(
      "\\b" +
      escaped +
      "\\b",
      "i"
    );

  if (
    regex.test(sentence)
  ) {

    return sentence.replace(
      regex,
      "_____"
    );

  }


  /*
    Bazı kelimeler cümlede
    farklı biçimde bulunabilir.
    Örneğin:

    abandon
    abandoned

    Bu durumda cümleyi
    kelime olmadan da gösteriyoruz.
  */

  return sentence;

}


/*
  Seçili gruptan 4 seçenek oluştur.
*/

function createOptions(correctItem) {

  const options = [correctItem];

  const candidates =
    selectedDeck.filter(
      function(item) {

        return (
          item.word.toLowerCase() !==
          correctItem.word.toLowerCase()
        );

      }
    );


  shuffle(candidates);


  for (
    let i = 0;
    i < candidates.length &&
    options.length < 4;
    i++
  ) {

    options.push(
      candidates[i]
    );

  }


  shuffle(options);

  return options;

}


/*
  Game sorularını hazırla.

  Sadece örnek cümlesi olan
  kelimeler kullanılıyor.
*/

function createGameQuestions() {

  const possible =
    selectedDeck.filter(
      function(item) {

        return (
          item.examples &&
          item.examples.length > 0
        );

      }
    );


  gameQuestions = [];


  if (
    possible.length === 0
  ) {

    return;

  }


  /*
    Önce kelimeleri karıştırıyoruz.
  */

  shuffle(possible);


  possible.forEach(
    function(item) {

      const examples =
        item.examples.slice();

      shuffle(examples);


      const sentence =
        examples[0];


      const options =
        createOptions(item);


      /*
        En az 4 farklı kelime varsa
        normal soru oluştur.
      */

      if (
        options.length >= 4
      ) {

        gameQuestions.push({

          item: item,

          sentence: sentence,

          options: options

        });

      }

    }
  );

}

  GAME PANELİ AÇ
*/

gameBtn.addEventListener(

    if (

);


/*
  GAME BAŞLAT
*/

gameStartBtn.addEventListener(
  "click",
  function() {

    createGameQuestions();


    if (
      gameQuestions.length === 0
    ) {

      alert(
        "Bu aralıkta yeterli örnek cümle bulunamadı. En az 4 farklı kelimenin örnek cümlesi olması gerekiyor."
      );

      return;

    }


    gameQuestionIndex = 0;

    gameScore = 0;

    gameAnswered = false;


    gameStartScreen.style.display =
      "none";

    gameQuestionScreen.style.display =
      "block";


    updateGameScore();

    showGameQuestion();

  }
);


/*
  SKOR
*/

function updateGameScore() {

  gameScoreEl.textContent =
    "Skor: " +
    gameScore +
    " / " +
    gameQuestionIndex;

}


/*
  SORUYU GÖSTER
*/

function showGameQuestion() {

  if (
    gameQuestionIndex >=
    gameQuestions.length
  ) {

    finishGame();

    return;

  }


  currentGameQuestion =
    gameQuestions[
      gameQuestionIndex
    ];


  gameAnswered = false;


  gameQuestionNumber.textContent =
    "Soru " +
    (gameQuestionIndex + 1) +
    " / " +
    gameQuestions.length;


  /*
    Cümlede kelimeyi gizle.
  */

  const hiddenSentence =
    hideWordInSentence(
      currentGameQuestion.sentence,
      currentGameQuestion.item.word
    );


  /*
    _____ kısmını mavi göstermek için
    HTML'e dönüştürüyoruz.
  */

  gameSentence.innerHTML =
    escapeGameHtml(
      hiddenSentence
    ).replace(
      /_____+/g,
      '<span class="blank">_____</span>'
    );


  /*
    Seçenekleri oluştur.
  */

  gameOptions.innerHTML =
    "";


  currentGameQuestion.options.forEach(
    function(item) {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "option-btn";


      const wordSpan =
        document.createElement(
          "span"
        );

      wordSpan.className =
        "option-word";

      wordSpan.textContent =
        item.word;


      const meaningSpan =
        document.createElement(
          "span"
        );

      meaningSpan.className =
        "option-meaning";

      meaningSpan.textContent =
        " (" +
        getMeaning(item) +
        ")";


      button.appendChild(
        wordSpan
      );

      button.appendChild(
        meaningSpan
      );


      button.addEventListener(
        "click",
        function() {

          answerGame(
            button,
            item
          );

        }
      );


      gameOptions.appendChild(
        button
      );

    }
  );


  gameResult.textContent =
    "";

  gameNextBtn.style.display =
    "none";


  updateGameScore();

}


/*
  HTML güvenliği
*/

function escapeGameHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/*
  CEVAP
*/

function answerGame(
  selectedButton,
  selectedItem
) {

  if (gameAnswered) {
    return;
  }


  gameAnswered = true;


  const correctItem =
    currentGameQuestion.item;


  const buttons =
    gameOptions.querySelectorAll(
      ".option-btn"
    );


  /*
    Tüm butonları kilitle.
  */

  buttons.forEach(
    function(button) {

      button.disabled =
        true;

    }
  );


  /*
    Doğru cevabı bul.
  */

  buttons.forEach(
    function(button) {

      const word =
        button
          .querySelector(
            ".option-word"
          )
          .textContent;


      if (
        word.toLowerCase() ===
        correctItem.word.toLowerCase()
      ) {

        button.classList.add(
          "correct"
        );

      }

    }
  );


  /*
    Kullanıcının seçtiği doğru mu?
  */

  if (
    selectedItem.word.toLowerCase() ===
    correctItem.word.toLowerCase()
  ) {

    gameScore++;

    gameResult.textContent =
      "✅ Doğru! " +
      correctItem.word +
      " (" +
      getMeaning(correctItem) +
      ")";

  } else {

    selectedButton.classList.add(
      "wrong"
    );

    gameResult.textContent =
      "❌ Yanlış! Doğru cevap: " +
      correctItem.word +
      " (" +
      getMeaning(correctItem) +
      ")";

  }


  updateGameScore();


  gameNextBtn.style.display =
    "block";

}


/*
  SONRAKİ SORU
*/

gameNextBtn.addEventListener(
  "click",
  function() {

    gameQuestionIndex++;

    showGameQuestion();

  }
);


/*
  OYUN BİTTİ
*/

function finishGame() {

  gameQuestionScreen.style.display =
    "none";

  gameStartScreen.style.display =
    "block";


  gameStartInfo.innerHTML =
    "🎉 Oyun bitti!<br><br>" +
    "<strong>" +
    gameScore +
    " / " +
    gameQuestions.length +
    "</strong> doğru yaptın.";


  gameStartBtn.textContent =
    "Tekrar Oyna";

}

*/

gameCloseBtn.addEventListener(

    gamePanel.style.display =

      Flashcard'a geri dönünce
      yeni kart göster.
    */

    nextCard();

  }
);


/* =========================
   INIT
========================= */

async function init() {

  loadStats();

  loadSettings();

  renderStats();


  try {

    const response =
      await fetch(
        DATA_FILE,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "august.txt bulunamadı."
      );

    }


    const text =
      await response.text();


    deck =
      text
        .split(/\r?\n/)
        .map(parseLine)
        .filter(Boolean);


    if (
      deck.length === 0
    ) {

      throw new Error(
        "august.txt içinde geçerli kelime bulunamadı."
      );

    }


    totalWords.textContent =
      deck.length;


    loading.style.display =
      "none";

    card.style.display =
      "flex";

    controls.style.display =
      "flex";

    statsBox.style.display =
      "flex";

    resetBtn.style.display =
      "block";


    createRangeButtons();


    /*
      Önceden seçilmiş aralık varsa
      onu yükle.
    */

    if (
      selectedRange &&
      selectedRange.start >= 0 &&
      selectedRange.end <= deck.length
    ) {

      let label;


      if (
        selectedRange.start === 0 &&
        selectedRange.end === deck.length
      ) {

        label = "Tümü";

      } else {

        label =
          (selectedRange.start + 1) +
          "-" +
          selectedRange.end;

      }


      selectRange(
        selectedRange.start,
        selectedRange.end,
        label
      );

    } else {

      /*
        İlk açılış:
        1-50
      */

      const size =
        parseInt(
          chunkSize.value,
          10
        ) || 50;


      const end =
        Math.min(
          size,
          deck.length
        );


      selectRange(
        0,
        end,
        "1-" + end
      );

    }

  } catch (error) {

    loading.style.display =
      "none";

    errorBox.style.display =
      "block";

    errorBox.textContent =
      "Hata: " +
      error.message +
      " august.txt dosyasının index.html ile aynı klasörde olduğundan emin ol.";

  }

}


init();
