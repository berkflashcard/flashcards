<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelime Kartları</title>

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --accent: #38bdf8;
  --good: #22c55e;
  --bad: #ef4444;
  --text: #e2e8f0;
  --muted: #94a3b8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
}

/* ÜST KISIM */

.topbar {
  width: 100%;
  max-width: 480px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

h1 {
  font-size: 18px;
  color: var(--muted);
  font-weight: 500;
  margin: 0;
}

.settings-btn {
  background: var(--card);
  color: var(--text);
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.settings-btn:hover {
  opacity: 0.85;
}

/* SETTINGS PANEL */

.settings-panel {
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 20px;
  display: none;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.settings-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 8px;
}

.total-words {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 15px;
}

.setting-row {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}

.chunk-input {
  flex: 1;
  background: #0f172a;
  color: var(--text);
  border: 1px solid #475569;
  border-radius: 10px;
  padding: 11px;
  font-size: 14px;
  outline: none;
}

.chunk-input:focus {
  border-color: var(--accent);
}

.apply-btn {
  background: var(--accent);
  color: #0f172a;
  border: none;
  border-radius: 10px;
  padding: 11px 18px;
  font-weight: 700;
  cursor: pointer;
}

.ranges-title {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 9px;
}

.ranges {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.range-btn {
  background: #0f172a;
  color: var(--text);
  border: 1px solid #334155;
  border-radius: 9px;
  padding: 8px 11px;
  font-size: 12px;
  cursor: pointer;
}

.range-btn.active {
  background: var(--accent);
  color: #0f172a;
  border-color: var(--accent);
  font-weight: 700;
}

/* SEÇİLİ ARALIK */

.selected-info {
  width: 100%;
  max-width: 480px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 12px;
}

/* İSTATİSTİK */

.stats {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

.stat {
  background: var(--card);
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 13px;
  color: var(--muted);
}

.stat b {
  color: var(--text);
  font-size: 15px;
  display: block;
}

/* KART */

.card {
  background: var(--card);
  border-radius: 18px;
  padding: 32px 24px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  text-align: center;
  min-height: 260px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 14px;
}

.word {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.meanings {
  font-size: 20px;
  color: var(--accent);
  font-weight: 600;
  display: none;
}

.examples {
  text-align: left;
  font-size: 14px;
  color: var(--muted);
  display: none;
  line-height: 1.5;
  margin-top: 6px;
}

.examples div {
  margin-bottom: 6px;
}

.progress {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

/* BUTONLAR */

.controls {
  display: flex;
  gap: 10px;
  margin-top: 22px;
  width: 100%;
  max-width: 480px;
  flex-wrap: wrap;
}

button {
  flex: 1;
  min-width: 120px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

.btn-show {
  background: var(--accent);
  color: #0f172a;
}

.btn-good {
  background: var(--good);
  color: #052e16;
  display: none;
}

.btn-bad {
  background: var(--bad);
  color: #450a0a;
  display: none;
}

.btn-reset {
  background: transparent;
  color: var(--muted);
  border: 1px solid #334155;
  margin-top: 16px;
  flex: none;
  padding: 8px 16px;
  font-size: 12px;
}

.loading {
  color: var(--muted);
  margin-top: 60px;
}

.error {
  color: var(--bad);
  margin-top: 60px;
  text-align: center;
  max-width: 480px;
}
</style>
</head>

<body>

<!-- ÜST BAR -->

<div class="topbar">

  <h1>🇬🇧 → 🇹🇷 Kelime Kartları</h1>

  <button class="settings-btn" id="settingsBtn">
    ⚙️ Settings
  </button>

</div>


<!-- SETTINGS -->

<div class="settings-panel" id="settingsPanel">

  <div class="settings-title">
    Kelime Grupları
  </div>

  <div class="total-words">
    August.txt toplam kelime:
    <b id="totalWords">0</b>
  </div>

  <div class="setting-row">

    <input
      type="number"
      id="chunkSize"
      class="chunk-input"
      min="1"
      placeholder="Örn: 50"
    >

    <button
      class="apply-btn"
      id="applyBtn"
    >
      Apply
    </button>

  </div>

  <div class="ranges-title">
    Kelime aralığını seç:
  </div>

  <div
    class="ranges"
    id="ranges"
  ></div>

</div>


<!-- SEÇİLEN ARALIK -->

<div
  class="selected-info"
  id="selectedInfo"
  style="display:none"
></div>


<!-- İSTATİSTİK -->

<div
  class="stats"
  id="stats"
  style="display:none"
>

  <div class="stat">
    Doğru
    <b id="statGood">0</b>
  </div>

  <div class="stat">
    Yanlış
    <b id="statBad">0</b>
  </div>

  <div class="stat">
    Başarı
    <b id="statRate">%0</b>
  </div>

</div>


<!-- YÜKLENİYOR -->

<div
  id="loading"
  class="loading"
>
  Kelimeler yükleniyor...
</div>


<!-- HATA -->

<div
  id="errorBox"
  class="error"
  style="display:none"
></div>


<!-- KELİME KARTI -->

<div
  class="card"
  id="card"
  style="display:none"
>

  <div
    class="word"
    id="wordEl"
  ></div>

  <div
    class="meanings"
    id="meaningsEl"
  ></div>

  <div
    class="examples"
    id="examplesEl"
  ></div>

  <div
    class="progress"
    id="progressEl"
  ></div>

</div>


<!-- KONTROLLER -->

<div
  class="controls"
  id="controls"
  style="display:none"
>

  <button
    class="btn-show"
    id="showBtn"
  >
    Cevabı Göster
  </button>

  <button
    class="btn-good"
    id="goodBtn"
  >
    ✅ Bildim
  </button>

  <button
    class="btn-bad"
    id="badBtn"
  >
    ❌ Bilemedim
  </button>

</div>


<!-- RESET -->

<button
  class="btn-reset"
  id="resetBtn"
  style="display:none"
>
  İstatistikleri sıfırla
</button>


<script>

const DATA_FILE = "august.txt";

const STORAGE_KEY = "flashcards_stats_v1";

const SETTINGS_KEY = "flashcards_settings_v1";


/* ANA DEĞİŞKENLER */

let deck = [];

let selectedDeck = [];

let pool = [];

let currentIdx = null;

let selectedRange = null;

let stats = {
  good: 0,
  bad: 0
};


/* ELEMENTLER */

const loading = document.getElementById("loading");

const errorBox = document.getElementById("errorBox");

const card = document.getElementById("card");

const controls = document.getElementById("controls");

const statsBox = document.getElementById("stats");

const wordEl = document.getElementById("wordEl");

const meaningsEl = document.getElementById("meaningsEl");

const examplesEl = document.getElementById("examplesEl");

const progressEl = document.getElementById("progressEl");

const showBtn = document.getElementById("showBtn");

const goodBtn = document.getElementById("goodBtn");

const badBtn = document.getElementById("badBtn");

const resetBtn = document.getElementById("resetBtn");

const statGood = document.getElementById("statGood");

const statBad = document.getElementById("statBad");

const statRate = document.getElementById("statRate");

const settingsBtn = document.getElementById("settingsBtn");

const settingsPanel = document.getElementById("settingsPanel");

const totalWords = document.getElementById("totalWords");

const chunkSize = document.getElementById("chunkSize");

const applyBtn = document.getElementById("applyBtn");

const ranges = document.getElementById("ranges");

const selectedInfo = document.getElementById("selectedInfo");


/* SATIR PARSE */

function parseLine(line) {

  line = line.trim();

  if (!line) {
    return null;
  }

  const equalIndex = line.indexOf("=");

  if (equalIndex === -1) {
    return null;
  }

  const word = line
    .substring(0, equalIndex)
    .trim();

  const rest = line
    .substring(equalIndex + 1)
    .trim();

  const parts = rest
    .split("/")
    .map(function(part) {
      return part.trim();
    })
    .filter(Boolean);

  if (parts.length === 0) {
    return null;
  }

  const meanings = parts[0]
    .split(",")
    .map(function(item) {
      return item.trim();
    })
    .filter(Boolean);

  const examples = parts.slice(1);

  if (!word || meanings.length === 0) {
    return null;
  }

  return {
    word: word,
    meanings: meanings,
    examples: examples
  };
}


/* RANDOM */

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j = Math.floor(
      Math.random() * (i + 1)
    );

    const temp = array[i];

    array[i] = array[j];

    array[j] = temp;
  }

}


/* İSTATİSTİKLERİ YÜKLE */

function loadStats() {

  try {

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if (saved) {

      const parsed =
        JSON.parse(saved);

      if (
        typeof parsed.good === "number" &&
        typeof parsed.bad === "number"
      ) {

        stats = parsed;

      }

    }

  } catch (error) {

    stats = {
      good: 0,
      bad: 0
    };

  }

}


/* İSTATİSTİKLERİ KAYDET */

function saveStats() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(stats)
  );

}


/* İSTATİSTİKLERİ GÖSTER */

function renderStats() {

  const total =
    stats.good + stats.bad;

  let rate = 0;

  if (total > 0) {

    rate = Math.round(
      (stats.good / total) * 100
    );

  }

  statGood.textContent =
    stats.good;

  statBad.textContent =
    stats.bad;

  statRate.textContent =
    "%" + rate;

}


/* SETTINGS KAYDET */

function saveSettings() {

  const data = {

    chunkSize:
      parseInt(chunkSize.value, 10) || 50,

    start:
      selectedRange
        ? selectedRange.start
        : 0,

    end:
      selectedRange
        ? selectedRange.end
        : 0

  };

  localStorage.setItem(
    SETTINGS_KEY,
    JSON.stringify(data)
  );

}


/* SETTINGS YÜKLE */

function loadSettings() {

  try {

    const saved =
      localStorage.getItem(SETTINGS_KEY);

    if (!saved) {
      chunkSize.value = 50;
      return;
    }

    const data =
      JSON.parse(saved);

    if (
      data.chunkSize &&
      data.chunkSize > 0
    ) {

      chunkSize.value =
        data.chunkSize;

    } else {

      chunkSize.value = 50;

    }

    if (
      typeof data.start === "number" &&
      typeof data.end === "number" &&
      data.end > data.start
    ) {

      selectedRange = {
        start: data.start,
        end: data.end
      };

    }

  } catch (error) {

    chunkSize.value = 50;

  }

}


/* GRUP BUTONLARINI OLUŞTUR */

function createRangeButtons() {

  ranges.innerHTML = "";

  const size =
    parseInt(chunkSize.value, 10);

  if (
    !size ||
    size < 1 ||
    deck.length === 0
  ) {

    return;

  }


  /* TÜMÜ */

  const allButton =
    document.createElement("button");

  allButton.className =
    "range-btn";

  allButton.textContent =
    "Tümü (" + deck.length + ")";

  allButton.dataset.start = "0";

  allButton.dataset.end =
    String(deck.length);

  allButton.addEventListener(
    "click",
    function() {

      selectRange(
        0,
        deck.length,
        "Tümü"
      );

    }
  );

  ranges.appendChild(allButton);


  /* GRUPLAR */

  for (
    let start = 0;
    start < deck.length;
    start += size
  ) {

    const end =
      Math.min(
        start + size,
        deck.length
      );

    const button =
      document.createElement("button");

    button.className =
      "range-btn";

    button.textContent =
      (start + 1) + "-" + end;

    button.dataset.start =
      String(start);

    button.dataset.end =
      String(end);

    button.addEventListener(
      "click",
      function() {

        selectRange(
          start,
          end,
          (start + 1) + "-" + end
        );

      }
    );

    ranges.appendChild(button);

  }

}


/* ARALIK SEÇ */

function selectRange(
  start,
  end,
  label
) {

  /*
    Örneğin:

    start = 50
    end = 100

    slice(50,100)

    51-100 arasındaki
    kelimeleri getirir.
  */

  selectedDeck =
    deck.slice(start, end);


  if (selectedDeck.length === 0) {

    return;

  }


  /* RANDOM HAVUZ */

  pool = [];

  for (
    let i = 0;
    i < selectedDeck.length;
    i++
  ) {

    pool.push(i);

  }

  shuffle(pool);


  selectedRange = {
    start: start,
    end: end,
    label: label
  };


  saveSettings();


  /* AKTİF BUTON */

  const buttons =
    ranges.querySelectorAll(
      ".range-btn"
    );

  buttons.forEach(function(button) {

    button.classList.remove("active");

    const buttonStart =
      Number(button.dataset.start);

    const buttonEnd =
      Number(button.dataset.end);

    if (
      buttonStart === start &&
      buttonEnd === end
    ) {

      button.classList.add("active");

    }

  });


  /* BİLGİ */

  selectedInfo.style.display =
    "block";

  selectedInfo.textContent =
    "Seçilen bölüm: " +
    label +
    " · " +
    selectedDeck.length +
    " kelime";


  /* KART */

  nextCard();

}


/* SONRAKİ KART */

function nextCard() {

  if (
    selectedDeck.length === 0
  ) {

    return;

  }


  /*
    Havuz boşsa yeni random tur.
  */

  if (pool.length === 0) {

    for (
      let i = 0;
      i < selectedDeck.length;
      i++
    ) {

      pool.push(i);

    }

    shuffle(pool);

  }


  currentIdx =
    pool.pop();


  const item =
    selectedDeck[currentIdx];


  wordEl.textContent =
    item.word;


  meaningsEl.textContent =
    item.meanings.join(", ");


  examplesEl.innerHTML = "";


  item.examples.forEach(
    function(example) {

      const div =
        document.createElement("div");

      div.textContent =
        "• " + example;

      examplesEl.appendChild(div);

    }
  );


  meaningsEl.style.display =
    "none";

  examplesEl.style.display =
    "none";


  showBtn.style.display =
    "block";

  goodBtn.style.display =
    "none";

  badBtn.style.display =
    "none";


  progressEl.textContent =
    "Bu bölüm: " +
    selectedDeck.length +
    " kelime · Kalan: " +
    (pool.length + 1);

}


/* CEVABI GÖSTER */

showBtn.addEventListener(
  "click",
  function() {

    meaningsEl.style.display =
      "block";

    examplesEl.style.display =
      "block";

    showBtn.style.display =
      "none";

    goodBtn.style.display =
      "block";

    badBtn.style.display =
      "block";

  }
);


/* BİLDİM */

goodBtn.addEventListener(
  "click",
  function() {

    stats.good++;

    saveStats();

    renderStats();

    nextCard();

  }
);


/* BİLEMEDİM */

badBtn.addEventListener(
  "click",
  function() {

    stats.bad++;

    saveStats();

    renderStats();


    /*
      Yanlış kelimeyi tekrar havuza
      rastgele bir yere koyuyoruz.
    */

    const position =
      Math.floor(
        Math.random() *
        (pool.length + 1)
      );

    pool.splice(
      position,
      0,
      currentIdx
    );


    nextCard();

  }
);


/* SETTINGS AÇ / KAPA */

settingsBtn.addEventListener(
  "click",
  function() {

    if (
      settingsPanel.style.display ===
      "block"
    ) {

      settingsPanel.style.display =
        "none";

    } else {

      settingsPanel.style.display =
        "block";

    }

  }
);


/* APPLY */

applyBtn.addEventListener(
  "click",
  function() {

    const size =
      parseInt(
        chunkSize.value,
        10
      );


    if (
      !size ||
      size < 1
    ) {

      alert(
        "Lütfen 1 veya daha büyük bir sayı gir."
      );

      return;

    }


    /*
      Yeni grupları oluştur.
    */

    createRangeButtons();


    /*
      İlk grubu otomatik seç.
    */

    const firstEnd =
      Math.min(
        size,
        deck.length
      );

    selectRange(
      0,
      firstEnd,
      "1-" + firstEnd
    );

  }
);


/* ENTER = APPLY */

chunkSize.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      applyBtn.click();

    }

  }
);


/* RESET */

resetBtn.addEventListener(
  "click",
  function() {

    const confirmed =
      confirm(
        "İstatistikleri sıfırlamak istediğine emin misin?"
      );

    if (confirmed) {

      stats = {
        good: 0,
        bad: 0
      };

      saveStats();

      renderStats();

    }

  }
);


/* SAYFAYI BAŞLAT */

async function init() {

  loadStats();

  loadSettings();

  renderStats();


  try {

    const response =
      await fetch(
        DATA_FILE,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "august.txt bulunamadı."
      );

    }


    const text =
      await response.text();


    deck =
      text
        .split(/\r?\n/)
        .map(parseLine)
        .filter(Boolean);


    if (
      deck.length === 0
    ) {

      throw new Error(
        "august.txt içinde geçerli kelime bulunamadı."
      );

    }


    /* TOPLAM KELİME */

    totalWords.textContent =
      deck.length;


    /* EKRANI GÖSTER */

    loading.style.display =
      "none";

    card.style.display =
      "flex";

    controls.style.display =
      "flex";

    statsBox.style.display =
      "flex";

    resetBtn.style.display =
      "block";


    /*
      Grup butonlarını oluştur.
    */

    createRangeButtons();


    /*
      Daha önce kayıtlı seçim varsa
      onu kullan.
    */

    if (
      selectedRange &&
      selectedRange.start >= 0 &&
      selectedRange.end <= deck.length
    ) {

      selectRange(
        selectedRange.start,
        selectedRange.end,
        selectedRange.start === 0 &&
        selectedRange.end === deck.length
          ? "Tümü"
          : (
              (selectedRange.start + 1) +
              "-" +
              selectedRange.end
            )
      );

    } else {

      /*
        İlk açılışta 50 kelime.
      */

      const size =
        parseInt(
          chunkSize.value,
          10
        ) || 50;

      const end =
        Math.min(
          size,
          deck.length
        );

      selectRange(
        0,
        end,
        "1-" + end
      );

    }

  } catch (error) {

    loading.style.display =
      "none";

    errorBox.style.display =
      "block";

    errorBox.textContent =
      "Hata: " +
      error.message +
      " august.txt dosyasının index.html ile aynı klasörde olduğundan emin ol.";

  }

}


/* BAŞLAT */

init();

</script>

</body>
</html>
