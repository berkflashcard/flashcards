<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelime Kartları</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --good:#22c55e; --bad:#ef4444; --text:#e2e8f0; --muted:#94a3b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:24px 16px;
  }
  h1{font-size:18px; color:var(--muted); font-weight:500; margin:0 0 20px;}
  .stats{
    display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; justify-content:center;
  }
  .stat{
    background:var(--card); padding:8px 14px; border-radius:10px; font-size:13px; color:var(--muted);
  }
  .stat b{color:var(--text); font-size:15px; display:block;}
  .card{
    background:var(--card); border-radius:18px; padding:32px 24px; width:100%; max-width:480px;
    box-shadow:0 10px 30px rgba(0,0,0,.3); text-align:center; min-height:260px;
    display:flex; flex-direction:column; justify-content:center; gap:14px;
  }
  .word{font-size:32px; font-weight:700; letter-spacing:.5px;}
  .meanings{font-size:20px; color:var(--accent); font-weight:600; display:none;}
  .examples{text-align:left; font-size:14px; color:var(--muted); display:none; line-height:1.5; margin-top:6px;}
  .examples div{margin-bottom:6px;}
  .progress{font-size:12px; color:var(--muted); margin-top:4px;}
  .controls{display:flex; gap:10px; margin-top:22px; width:100%; max-width:480px; flex-wrap:wrap;}
  button{
    flex:1; min-width:120px; padding:14px; border:none; border-radius:12px; font-size:15px;
    font-weight:600; cursor:pointer; transition:transform .1s, opacity .2s;
  }
  button:active{transform:scale(0.97);}
  .btn-show{background:var(--accent); color:#0f172a;}
  .btn-good{background:var(--good); color:#052e16; display:none;}
  .btn-bad{background:var(--bad); color:#450a0a; display:none;}
  .btn-reset{background:transparent; color:var(--muted); border:1px solid #334155; margin-top:16px; flex:none; padding:8px 16px; font-size:12px;}
  .loading{color:var(--muted); margin-top:60px;}
  .error{color:var(--bad); margin-top:60px; text-align:center; max-width:480px;}
</style>
</head>
<body>

<h1>🇬🇧 → 🇹🇷 Kelime Kartları</h1>

<div class="stats" id="stats" style="display:none">
  <div class="stat">Doğru<b id="statGood">0</b></div>
  <div class="stat">Yanlış<b id="statBad">0</b></div>
  <div class="stat">Başarı<b id="statRate">%0</b></div>
</div>

<div id="loading" class="loading">Kelimeler yükleniyor...</div>
<div id="errorBox" class="error" style="display:none"></div>

<div class="card" id="card" style="display:none">
  <div class="word" id="wordEl"></div>
  <div class="meanings" id="meaningsEl"></div>
  <div class="examples" id="examplesEl"></div>
  <div class="progress" id="progressEl"></div>
</div>

<div class="controls" id="controls" style="display:none">
  <button class="btn-show" id="showBtn">Cevabı Göster</button>
  <button class="btn-good" id="goodBtn">✅ Bildim</button>
  <button class="btn-bad" id="badBtn">❌ Bilemedim</button>
</div>

<button class="btn-reset" id="resetBtn" style="display:none">İstatistikleri sıfırla</button>

<script>
const DATA_FILE = "august.txt"; // aynı klasörde olmalı
const STORAGE_KEY = "flashcards_stats_v1";

let deck = [];
let pool = [];        // henüz bu turda sorulmamış indeksler
let currentIdx = null;
let stats = { good: 0, bad: 0 };

const els = {
  loading: document.getElementById("loading"),
  errorBox: document.getElementById("errorBox"),
  card: document.getElementById("card"),
  controls: document.getElementById("controls"),
  statsBox: document.getElementById("stats"),
  word: document.getElementById("wordEl"),
  meanings: document.getElementById("meaningsEl"),
  examples: document.getElementById("examplesEl"),
  progress: document.getElementById("progressEl"),
  showBtn: document.getElementById("showBtn"),
  goodBtn: document.getElementById("goodBtn"),
  badBtn: document.getElementById("badBtn"),
  resetBtn: document.getElementById("resetBtn"),
  statGood: document.getElementById("statGood"),
  statBad: document.getElementById("statBad"),
  statRate: document.getElementById("statRate"),
};

function parseLine(line) {
  line = line.trim();
  if (!line) return null;
  const eqIdx = line.indexOf("=");
  if (eqIdx === -1) return null;
  const word = line.slice(0, eqIdx).trim();
  const rest = line.slice(eqIdx + 1);
  const parts = rest.split("/").map(p => p.trim()).filter(Boolean);
  if (parts.length === 0) return null;
  const meanings = parts[0].split(",").map(s => s.trim()).filter(Boolean);
  const examples = parts.slice(1);
  if (!word || meanings.length === 0) return null;
  return { word, meanings, examples };
}

function loadStats() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) stats = JSON.parse(raw);
  } catch (e) {}
}

function saveStats() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
}

function renderStats() {
  const total = stats.good + stats.bad;
  const rate = total ? Math.round((stats.good / total) * 100) : 0;
  els.statGood.textContent = stats.good;
  els.statBad.textContent = stats.bad;
  els.statRate.textContent = "%" + rate;
}

function refillPoolIfNeeded() {
  if (pool.length === 0) {
    pool = deck.map((_, i) => i);
    // Fisher-Yates shuffle
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
  }
}

function nextCard() {
  refillPoolIfNeeded();
  currentIdx = pool.pop();
  const item = deck[currentIdx];

  els.word.textContent = item.word;
  els.meanings.textContent = item.meanings.join(", ");
  els.examples.innerHTML = item.examples.map(ex => `<div>• ${ex}</div>`).join("");
  els.meanings.style.display = "none";
  els.examples.style.display = "none";

  els.showBtn.style.display = "block";
  els.goodBtn.style.display = "none";
  els.badBtn.style.display = "none";

  const answered = stats.good + stats.bad;
  els.progress.textContent = `Kart havuzu: ${deck.length} kelime · Bu oturumda kalan: ${pool.length + 1}`;
}

els.showBtn.addEventListener("click", () => {
  els.meanings.style.display = "block";
  els.examples.style.display = "block";
  els.showBtn.style.display = "none";
  els.goodBtn.style.display = "block";
  els.badBtn.style.display = "block";
});

els.goodBtn.addEventListener("click", () => {
  stats.good++;
  saveStats();
  renderStats();
  nextCard();
});

els.badBtn.addEventListener("click", () => {
  stats.bad++;
  saveStats();
  renderStats();
  // yanlış bilinen kelimeyi bu turun havuzuna geri koy, tekrar karşına çıksın
  pool.unshift(currentIdx);
  nextCard();
});

els.resetBtn.addEventListener("click", () => {
  if (confirm("İstatistikleri sıfırlamak istediğine emin misin?")) {
    stats = { good: 0, bad: 0 };
    saveStats();
    renderStats();
  }
});

async function init() {
  loadStats();
  renderStats();
  try {
    const res = await fetch(DATA_FILE, { cache: "no-store" });
    if (!res.ok) throw new Error("Dosya bulunamadı: " + DATA_FILE);
    const text = await res.text();
    deck = text.split("\n").map(parseLine).filter(Boolean);
    if (deck.length === 0) throw new Error("Dosyada geçerli kelime bulunamadı.");

    els.loading.style.display = "none";
    els.card.style.display = "flex";
    els.controls.style.display = "flex";
    els.statsBox.style.display = "flex";
    els.resetBtn.style.display = "inline-block";

    nextCard();
  } catch (err) {
    els.loading.style.display = "none";
    els.errorBox.style.display = "block";
    els.errorBox.textContent = "Hata: " + err.message + " — " + DATA_FILE + " dosyasının index.html ile aynı klasörde olduğundan emin ol.";
  }
}

init();
</script>
</body>
</html>
